app-id: org.cubocore.CorePDF
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: corepdf
rename-desktop-file: cc.cubocore.CorePDF.desktop
rename-icon: cc.cubocore.CorePDF
rename-appdata-file: cc.cubocore.CorePDF.metainfo.xml
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home # Listing pdf documents and saving it in config folder
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/pkgconfig
  - /man
  - /share/man
  - /lib/*.la
  - /lib/*.a
modules:
  - name: libcprime
    buildsystem: cmake-ninja
    config-opts: [
        "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    ]
    sources:
      - type: git
        url: https://gitlab.com/cubocore/libcprime.git
        commit: 17d4c94f3be2c7f67dc757cf852f0144945c2c69
        tag: v5.0.1
  - name: poppler
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_BOOST=OFF
      - -DENABLE_QT5=OFF
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/poppler/poppler
        tag: poppler-25.12.0
  - name: qdocumentview
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.com/extraqt/qdocumentview
        tag: v0.3.0.1
  - name: corepdf
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://gitlab.com/cubocore/coreapps/corepdf.git
        commit: d7b263d5394d9b119bd3564b24b50f0bba513ba6
        tag: v5.0.1
      - type: patch
        path: fix-appID-name.patch
